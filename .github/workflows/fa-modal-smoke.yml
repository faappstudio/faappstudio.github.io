name: FA App Studio - Verificar modal promocional
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/fa-modal-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-modal-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar apertura inmediata del modal en Chrome real
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "No se encontro Chrome"; exit 1; fi
          echo "CHROME=$CHROME"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          source = p.read_text(encoding='utf-8')
          probe = """
          <script>
          (function(){
            var modal=document.getElementById('download-modal');
            var wa=document.querySelector('.download-modal .dialog-whatsapp');
            var play=document.querySelector('.download-modal [data-download="modal"]');
            var keep=document.getElementById('keep-browsing');
            var output=document.createElement('pre');
            output.id='fa-qa-results';
            var state={
              modalOpen:!!(modal&&modal.open),
              modalVisible:!!(modal&&modal.getBoundingClientRect().width>100),
              waExists:!!wa,
              waHasIcon:!!(wa&&wa.querySelector('svg')),
              waHref:wa?wa.getAttribute('href'):'',
              waBackground:wa?getComputedStyle(wa).backgroundColor:'',
              playHref:play?play.getAttribute('href'):'',
              keepExists:!!keep,
              noDelay:!document.documentElement.outerHTML.includes('4200')
            };
            output.textContent=JSON.stringify(state);
            document.body.appendChild(output);
          })();
          </script>"""
          if source.count('</body>') != 1: raise Exception('Unexpected HTML structure')
          Path('fa-modal-qa.html').write_text(source.replace('</body>',probe+'\n</body>'),encoding='utf-8')
          PY
          timeout 50s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=1800 --dump-dom "file://$PWD/fa-modal-qa.html" > qa-dom.txt 2> qa-chrome-stderr.txt
          python3 - <<'PY'
          import html, json, re
          source=open('qa-dom.txt',encoding='utf-8').read()
          match=re.search(r'<pre id="fa-qa-results">([^<]+)</pre>',source)
          if not match: raise Exception('Chrome did not execute smoke test; see logs')
          result=json.loads(html.unescape(match.group(1)))
          print('Browser test:',json.dumps(result,ensure_ascii=False,indent=2))
          assert result['modalOpen'], 'El modal no se abrio al cargar'
          assert result['modalVisible'], 'El modal no es visible'
          assert result['waExists'] and result['waHasIcon'], 'Falta boton o icono WhatsApp'
          assert 'wa.me/?text=' in result['waHref'], 'Falta mensaje para compartir'
          assert result['waBackground']=='rgb(20, 134, 74)', 'El boton WhatsApp no es verde'
          assert 'id=cl.rancherasfacil.app' in result['playHref'], 'Enlace de descarga incorrecto'
          assert result['keepExists'], 'Falta boton para cerrar'
          assert result['noDelay'], 'Se mantiene el temporizador anterior'
          print('MODAL_QA_SUCCESS')
          PY
