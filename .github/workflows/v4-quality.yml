name: V4 Quality Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "radio-mexico-de-siempre/**"
      - "assets/**"
      - "scripts/**"
      - "radio/index.html"
      - "privacy.html"
      - "stations-live.json"
      - "app-ads.txt"
      - ".github/workflows/v4-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Node 22 - static and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression checks
        run: node scripts/check-v4.mjs
      - name: Interaction checks
        run: node scripts/test-radio-behavior.mjs
